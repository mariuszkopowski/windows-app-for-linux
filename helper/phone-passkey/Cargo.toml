[package]
name = "phone-passkey-helper"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Phone (hybrid/caBLE) passkey helper for Windows App for Linux"

[dependencies]
libwebauthn = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
