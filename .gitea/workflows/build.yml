name: build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: qnap-docker
    container:
      image: node:22-bookworm
      options: --add-host=git.koprowski.cc:192.168.1.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: qnap-docker
    container:
      image: node:22-bookworm
      options: --add-host=git.koprowski.cc:192.168.1.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Install flatpak + snap build tools
        run: |
          apt-get update
          apt-get install -y flatpak flatpak-builder squashfs-tools
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - name: Build AppImage + Flatpak + Snap
        run: npm run build

      - name: Publish build as a release
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: http://git.koprowski.cc:3000/api/v1/repos/mkoprowski/windows-app-for-linux
          TAG: latest-build
        run: |
          set -euo pipefail

          json_id() { grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*'; }

          existing=$(curl -s -H "Authorization: token $GITEA_TOKEN" "$API/releases/tags/$TAG")
          existing_id=$(printf '%s' "$existing" | json_id || true)
          if [ -n "${existing_id:-}" ]; then
            curl -s -X DELETE -H "Authorization: token $GITEA_TOKEN" "$API/releases/$existing_id"
          fi
          curl -s -X DELETE -H "Authorization: token $GITEA_TOKEN" "$API/tags/$TAG" || true

          created=$(curl -s -X POST -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Latest build\",\"target_commitish\":\"${GITHUB_SHA:-main}\",\"prerelease\":true}" \
            "$API/releases")
          echo "create release response: $created"
          release_id=$(printf '%s' "$created" | json_id)
          if [ -z "$release_id" ]; then
            echo "Failed to create release, aborting"
            exit 1
          fi

          # Uploads over ~50MB fail with "failed to parse request multipart
          # form" on this instance (proxy body-size limit), so split each
          # file into chunks well under that and reassemble after download.
          shopt -s nullglob
          files=(dist/*.AppImage dist/*.flatpak dist/*.snap)
          shopt -u nullglob
          for f in "${files[@]}"; do
            name=$(basename "$f" | tr ' ' '-')
            split -b 30M -d -a 3 "$f" "/tmp/${name}.part"
            for part in /tmp/"${name}".part*; do
              pname=$(basename "$part")
              echo "uploading chunk $pname"
              curl -s -X POST -H "Authorization: token $GITEA_TOKEN" -H "Expect:" \
                -F "attachment=@${part};filename=${pname}" \
                "$API/releases/$release_id/assets"
              echo
            done
          done
